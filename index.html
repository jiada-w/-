<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紅蔥醬</title>

    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.2.2/default/snipcart.css" />

    <style>
        /* 指定全站採用微軟正黑體 */
        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", "Heiti TC", "sans-serif";
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        nav button {
            font-family: inherit;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            color: #2c3e50;
        }

        /* 商品展示區網格 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 15px;
            text-align: center;
        }

        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }

        .product-title {
            font-size: 18px;
            margin: 10px 0;
            font-weight: bold;
        }

        .product-price {
            color: #e74c3c;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .btn-add-cart {
            font-family: inherit;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        /* 客服留言區 */
        .contact-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin-top: 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .btn-submit {
            font-family: inherit;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">精選賣場</div>
        <nav>
            <button class="snipcart-checkout">
                🛒 購物車 (<span class="snipcart-items-count">0</span>)
            </button>
            <button class="snipcart-customer-signin">會員登入 / 註冊</button>
        </nav>
    </header>

    <div class="container">
        <section>
            <h2>熱門商品</h2>
            <div class="product-grid">
                
                <div class="product-card">
                    <img src="https://via.placeholder.com/300" alt="經典手作手提包">
                    <div class="product-title">經典手作手提包</div>
                    <div class="product-price">NT$ 1,200</div>
                    <button class="snipcart-add-item btn-add-cart"
                        data-item-id="bag-01"
                        data-item-price="1200"
                        data-item-url="/"
                        data-item-description="優質皮革手作手提包"
                        data-item-image="https://via.placeholder.com/300"
                        data-item-name="經典手作手提包">
                        加入購物車
                    </button>
                </div>

                <div class="product-card">
                    <img src="https://via.placeholder.com/300" alt="極簡質感馬克杯">
                    <div class="product-title">極簡質感馬克杯</div>
                    <div class="product-price">NT$ 350</div>
                    <button class="snipcart-add-item btn-add-cart"
                        data-item-id="cup-02"
                        data-item-price="350"
                        data-item-url="/"
                        data-item-description="陶瓷材質，耐熱好清洗"
                        data-item-image="https://via.placeholder.com/300"
                        data-item-name="極簡質感馬克杯">
                        加入購物車
                    </button>
                </div>

            </div>
        </section>

        <section class="contact-section">
            <h2>客服留言</h2>
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
                <div class="form-group">
                    <label for="name">您的姓名：</label>
                    <input type="text" id="name" name="name" required placeholder="例如：王小明">
                </div>
                <div class="form-group">
                    <label for="email">電子信箱：</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">留言內容：</label>
                    <textarea id="message" name="message" rows="5" required placeholder="請輸入您想詢問的問題..."></textarea>
                </div>
                <button type="submit" class="btn-submit">傳送留言</button>
            </form>
        </section>
    </div>

    <script async src="https://cdn.snipcart.com/themes/v3.2.2/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="YOUR_PUBLIC_API_KEY" data-config-modal-style="side"></div>

</body>
</html>
